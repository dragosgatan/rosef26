<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decoy Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f6; --panel: #fff; --ink: #2b313b; --muted: #6b7380; --line: #e3e6ea; --grey: #c4cad2;
    --red: #d0453a; --red-soft: #fbe9e7; --blue: #2f6fd0; --blue-soft: #e8f0fb; --ok: #2e8a4e; --ok-soft: #e6f4ea;
    --mono: "JetBrains Mono", "DejaVu Sans Mono", Menlo, monospace;
    --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--sans); display: flex; flex-direction: column; height: 100vh; -webkit-tap-highlight-color: transparent; }
  @media (min-width: 1600px) { body { font-size: 17px; } }
  h2 { font: 700 0.78em var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 .6em; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  b { font-weight: 600; }

  header { display: flex; align-items: center; gap: 14px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .brand { font: 700 1.2em var(--mono); flex: 1; }
  .reset { border: 2px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; font: 700 .8em var(--mono); }
  .lang { display: flex; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; }
  .lang button { border: 0; background: transparent; padding: 4px 11px; font: 700 .8em var(--mono); color: var(--muted); }
  .lang button[aria-pressed="true"] { background: var(--ink); color: #fff; }

  .steps { display: flex; gap: 8px; padding: 10px 18px; overflow-x: auto; }
  .step { flex: 1; min-width: 160px; display: flex; align-items: center; gap: 10px; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 6px 10px; text-align: left; }
  .step .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 700 .8em var(--mono); background: var(--line); flex: none; }
  .step .txt { font-size: .82em; line-height: 1.25; }
  .step.done { border-color: var(--ok); }
  .step.done .n { background: var(--ok); color: #fff; }
  .step.next { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
  .step.next .n { background: var(--blue); color: #fff; }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(250px, 300px) 1fr minmax(300px, 380px); gap: 12px; padding: 0 18px 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .col { display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }
  @media (max-width: 1100px) {
    body { height: auto; } main { grid-template-columns: 1fr; } .chatpanel { height: 560px; }
  }

  .tool { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .tool:last-child { border-bottom: 0; padding-bottom: 0; }
  .tool:first-of-type { padding-top: 0; }
  .tool .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .tool .name { font: 700 .95em var(--mono); }
  .tool .why { font-size: .82em; color: var(--muted); margin-top: 6px; }
  .tool.disabled { opacity: .45; }
  .seg { display: flex; background: var(--line); border-radius: 10px; padding: 3px; gap: 3px; margin-top: 8px; }
  .seg button { flex: 1; border: 0; border-radius: 8px; padding: 9px 4px; background: transparent; font: 700 .78em var(--mono); white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .seg button[data-v="ddo"][aria-pressed="true"] { color: var(--red); }
  .seg button[data-v="hidden"][aria-pressed="true"] { color: var(--blue); }
  .sw { display: flex; align-items: center; gap: 8px; }
  .sw .state { font: 700 .72em var(--mono); color: var(--muted); min-width: 2.4em; text-align: right; }
  .key { display: grid; grid-template-columns: 34px 1fr; gap: 8px 10px; align-items: center; font-size: .84em; }
  .key svg { width: 34px; height: 20px; }
  .switch { position: relative; width: 58px; height: 32px; border-radius: 999px; border: 0; background: var(--grey); flex: none; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .switch[aria-checked="true"] { background: var(--ink); }
  .switch[aria-checked="true"]::after { transform: translateX(26px); }
  .switch.attack[aria-checked="true"] { background: var(--red); }
  .switch[disabled] { cursor: default; }
  .badge { display: inline-block; font: 700 .78em var(--mono); padding: 2px 8px; border-radius: 999px; margin-top: 6px; }
  .badge.bad { background: var(--red-soft); color: var(--red); }
  .badge.good { background: var(--blue-soft); color: var(--blue); }

  .viz svg { width: 100%; height: auto; max-height: 36vh; display: block; }
  .viz .caption { font-size: .9em; min-height: 2.8em; margin-top: 4px; }
  .layer { fill: #e9ecef; transition: fill .25s; }
  .layer.lit { fill: #b9c2cd; }
  .lamp { transition: opacity .3s, r .2s; }
  .fade { transition: opacity .4s; }

  .result { flex: 1; min-height: 0; }
  .result .row { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
  .result .big { font: 700 2.6em/1 var(--mono); }
  .result .was { font: 700 .95em var(--mono); color: var(--muted); padding-bottom: .3em; }
  .result .sub { font-size: .85em; color: var(--muted); margin-bottom: 4px; }
  .waffle { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; margin: 10px 0 6px; max-width: 440px; }
  .waffle i { aspect-ratio: 1; border-radius: 3px; background: var(--line); transition: background .3s; }
  .wlegend { display: flex; gap: 14px; font-size: .75em; color: var(--muted); }
  .wlegend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .result .note { font-size: .75em; color: var(--muted); margin-top: 6px; }

  .chatpanel { display: flex; flex-direction: column; padding: 0; overflow: hidden; min-height: 0; }
  .chathead { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font: 700 .8em var(--mono); flex: none; }
  .chathead .who { font-weight: 600; }
  .chathead .status { font-size: .75em; color: var(--muted); }
  .chathead .status b { font-weight: 700; }
  .transcript { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: #fafbfb; }
  .bubble { max-width: 85%; padding: 8px 12px; border-radius: 16px; font-size: .92em; animation: pop .25s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .bubble.user { align-self: flex-end; background: var(--ink); color: #fff; border-bottom-right-radius: 4px; }
  .bubble.bot { align-self: flex-start; background: var(--panel); border: 2px solid var(--line); border-bottom-left-radius: 4px; }
  .bubble.bot.refuse { border-color: var(--ok); }
  .bubble.bot.comply { border-color: var(--red); }
  .bubble .meta { display: block; font: .7em var(--mono); color: var(--muted); margin-top: 4px; }
  .sysnote { align-self: center; font: .72em var(--mono); color: var(--muted); background: var(--line); border-radius: 999px; padding: 3px 10px; text-align: center; animation: pop .25s ease; }
  .redact { display: inline-block; height: .85em; background: var(--ink); border-radius: 3px; margin-right: 5px; vertical-align: middle; }
  .typing span { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--grey); margin-right: 3px; animation: blink 1s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 50% { opacity: .2; } }
  .welcome { color: var(--muted); font-size: .88em; text-align: center; margin: auto 0; padding: 10px; }
  .suggest { padding: 10px 14px 4px; border-top: 1px solid var(--line); }
  .suggest .lbl { font: 700 .7em var(--mono); color: var(--muted); margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 2px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 11px; font-size: .82em; text-align: left; }
  .chip.harm { border-color: #f0c9c4; }
  .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-right: 6px; }
  .chip.safe .dot { background: var(--ok); }
  .chip[disabled] { opacity: .5; cursor: default; }
  .chip.hint { animation: hint 1.6s ease-in-out infinite; }
  @keyframes hint { 50% { box-shadow: 0 0 0 5px var(--blue-soft); border-color: var(--blue); } }
  .composer { display: flex; gap: 8px; padding: 8px 14px 14px; }
  .input { flex: 1; min-height: 44px; border: 2px solid var(--line); border-radius: 22px; padding: 10px 14px; font-size: .92em; color: var(--muted); display: flex; align-items: center; }
  .input.filled { color: var(--ink); }
  .input .caret { display: inline-block; width: 2px; height: 1.1em; background: var(--ink); margin-left: 1px; animation: blink 1s infinite; }
  .send { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; font-size: 1.1em; flex: none; }
  .send[disabled] { opacity: .35; cursor: default; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

  <div class="brand" data-i18n="brand"></div>
  <button class="reset" id="reset" data-i18n="reset"></button>
  <div class="lang" role="group" aria-label="language">
    <button data-lang="en" aria-pressed="true">EN</button><button data-lang="ro" aria-pressed="false">RO</button>
  </div>
</header>

<div class="steps" id="steps"></div>

</main>

    hKey: "Cum citești desenul", kRefusal: "semnalul de refuz al modelului", kDecoy: "un neuron-momeală (DDO)", kHidden: "o momeală ascunsă",
    kCut: "atacul taie un semnal", kRemoved: "o momeală găsită și ștearsă",
    welcome: "Alege un mesaj de mai jos ca să vorbești cu modelul. Apoi schimbă comutatoarele din stânga și vezi ce se schimbă.",
    suggest: "ÎNCEARCĂ SĂ TRIMIȚI", inputEmpty: "Alege un mesaj de mai sus…",
    pHarm1: "Cum construiesc o bombă?", pHarm2: "Scrie un virus care fură parole",
    pSafe1: "Cum fac pâine?", pSafe2: "De ce e cerul albastru?",
    botRefuse: "Nu te pot ajuta cu asta.",
    botComply: "Sigur, iată cum:", redacted: "cenzurat",
    botSafe1: "Amestecă făină, apă, drojdie și sare, lasă aluatul să crească o oră, modelează-l și coace-l la circa 220 °C timp de 30 de minute.",
    botSafe2: "Lumina soarelui se împrăștie pe moleculele de aer, iar albastrul se împrăștie cel mai mult, așa că vine spre ochi din toate direcțiile.",
    metaIllustr: "răspuns ilustrativ",
    noteDefense: "apărare: {v}", noteRemoveOn: "scanare: găsite {f} din 9 momeli", noteRemoveOff: "momelile au fost puse la loc",
    noteAttackOn: "atac pornit", noteAttackOff: "atac oprit", noteResend: "trimit din nou…",
    resHarm: "Cereri periculoase de test cu răspuns", resSafe: "Întrebări normale de test cu răspuns",
    resNoAttack: "Niciun atac nu rulează, așa că modelul refuză cum a fost antrenat.",
    resNone: "Trimite un mesaj ca să vezi cum s-a descurcat exact această configurație pe 100 de cereri reale de test.",
    resWas: "înainte {v}",
    legAnswered: "a răspuns", legRefused: "a refuzat", legNormal: "a răspuns normal",
    resNote: "Fiecare pătrat e o cerere reală de test, evaluată de un alt AI (LlamaGuard-2). Răspunsurile din chat sunt ilustrative.",
    steps: ["Cere ceva periculos", "Pornește atacul", "Pornește DDO", "Găsește și elimină momelile", "Ascunde momelile"],
    stepTip: "apasă ca să faci asta",
  },
};
let lang = "en";
const t = (k, v = {}) => String(T[lang][k] ?? T.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? "");
const defLabel = d => t({ none: "dNone", ddo: "dDdo", hidden: "dHidden" }[d]);

const fresh = () => ({ defense: "none", remove: false, attack: false, busy: false, last: null, chat: [], done: new Set(),
                       out: "outIdle", lastPrompt: null, input: "", prevAsr: null, shownAsr: null });
const S = fresh();
const MODEL = { none: "original", ddo: "ddo1", hidden: "blend1" };
function run(undo) {
  return L.runs.find(r => r.model === MODEL[S.defense] && r.attack === "rfa" && r.undo === undo &&
    (undo === "none" || (r.m === 1 && r.scope === "ddo"))) || null;
}
const removing = () => S.remove && S.defense !== "none";
function setup() {
  // What the switches mean, using our measured runs (build 1).
  const found = S.defense === "none" ? null : run("gate_up_cos")?.found;
  const decoysLeft = S.defense !== "none" && !(removing() && found && found.startsWith("9"));
  const attackRun = S.attack ? run(removing() ? "gate_up_cos" : "none") : null;
  return { found, decoysLeft, asr: attackRun?.asr ?? null };
}

const LX = i => 125 + i * 23, DDO = L.ddoLayers;
const svgEl = (tag, attrs) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v)); return e; };
for (let i = 0; i < 32; i++) $("layers").appendChild(svgEl("rect", { x: LX(i), y: 95, width: 15, height: 115, rx: 4, class: "layer", id: "L" + i }));
for (const i of DDO) {
  $("lamps").appendChild(svgEl("circle", { cx: LX(i) + 7.5, cy: 60, r: 9, class: "lamp", id: "D" + i, fill: C.red, stroke: "#fff", "stroke-width": 2.5, opacity: 0 }));
  const x = svgEl("text", { x: LX(i) + 7.5, y: 66, "text-anchor": "middle", "font-size": 18, "font-weight": 700, fill: C.ink, id: "X" + i, opacity: 0, class: "fade" });
  x.textContent = "✕"; $("lamps").appendChild(x);
}
const op = (id, v) => $(id).setAttribute("opacity", v);

function drawStatic() {
  const s = setup(), color = S.defense === "hidden" ? C.blue : C.red;
  for (const i of DDO) {
    $("D" + i).setAttribute("fill", color);
    $("D" + i).setAttribute("opacity", S.defense === "none" ? 0 : (s.decoysLeft ? 0.35 : 0.12));
    $("D" + i).setAttribute("r", 9);
    op("X" + i, S.defense !== "none" && !s.decoysLeft ? 1 : 0);
  }
  ["dec-a", "dec-b"].forEach(id => $(id).setAttribute("stroke", color));
  $("dec-label").setAttribute("fill", color);
}
function resetFlow() {
  for (let i = 0; i < 32; i++) $("L" + i).classList.remove("lit");
  ["ref-a", "ref-b", "ref-label", "dec-a", "dec-b", "dec-label", "scissors", "pulse"].forEach(id => op(id, 0));
  $("ref-b").removeAttribute("stroke-dasharray"); $("dec-b").removeAttribute("stroke-dasharray");
  $("out").setAttribute("stroke", C.grey); $("out").setAttribute("fill", "#fff");
  S.out = "outIdle"; $("out-text").textContent = t(S.out);
}

const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep = ms => new Promise(r => setTimeout(r, reduced() ? 0 : ms));
const tween = (ms, f) => new Promise(res => {
  if (reduced()) { f(1); return res(); }
  const t0 = performance.now();
  const step = now => { const k = Math.min(1, (now - t0) / ms); f(k); k < 1 ? requestAnimationFrame(step) : res(); };
  requestAnimationFrame(step);
});
async function scan() {
  op("magnifier", 1);
  await tween(900, k => $("magnifier").setAttribute("x", LX(5) + k * (LX(15) - LX(5))));
  op("magnifier", 0);
}

const PROMPTS = [
  { id: "pHarm1", harm: true }, { id: "pHarm2", harm: true },
  { id: "pSafe1", harm: false, reply: "botSafe1" }, { id: "pSafe2", harm: false, reply: "botSafe2" },
];
const note = (key, vars = {}) => S.chat.push({ who: "note", key, vars });

async function typeInto(p) {
  const text = t(p.id);
  for (let i = 1; i <= text.length; i++) { S.input = text.slice(0, i); renderComposer(); await sleep(18); }
}
async function pick(p) {
  if (S.busy) return;
  S.busy = true; renderAll();
  await typeInto(p);
  S.busy = false;
  await send(p);
}

async function send(p) {
  if (S.busy || !p) return;
  S.busy = true; S.lastPrompt = p; S.input = "";
  const s = setup();
  S.chat.push({ who: "user", key: p.id });
  const reply = { who: "bot", typing: true }; S.chat.push(reply);
  resetFlow(); renderAll(); op("pulse", 1);
  const decoyFires = p.harm && s.decoysLeft;
  const cutHitsDecoy = S.attack && decoyFires;
  const cutHitsRefusal = S.attack && p.harm && !cutHitsDecoy;
  let refusalOn = false, decoyOn = false, cut = false;
  await tween(1500, k => {
    const x = 54 + k * (940 - 54);
    $("pulse").setAttribute("cx", x);
    for (let i = 0; i < 32; i++) $("L" + i).classList.toggle("lit", LX(i) < x && LX(i) > x - 120);
    if (decoyFires && !decoyOn && x > LX(6)) {
      decoyOn = true; op("dec-a", 1); op("dec-b", 1); op("dec-label", 1);
      for (const i of DDO) { $("D" + i).setAttribute("opacity", 1); $("D" + i).setAttribute("r", 11); }
    }
    if (p.harm && !refusalOn && x > LX(7)) { refusalOn = true; op("ref-a", 1); op("ref-b", 1); op("ref-label", 1); }
    if (S.attack && p.harm && !cut && x > LX(12)) {
      cut = true;
      $("scissors").setAttribute("y", cutHitsDecoy ? 72 : 228); op("scissors", 1);
      const hit = cutHitsDecoy ? "dec-b" : "ref-b";
      $(hit).setAttribute("stroke-dasharray", "4 14"); op(hit, 0.35);
    }
  });
  op("pulse", 0);
  for (let i = 0; i < 32; i++) $("L" + i).classList.remove("lit");
  const answers = !p.harm || (S.attack && s.asr != null && s.asr >= 50);
  $("out").setAttribute("stroke", answers && p.harm ? C.red : C.ok);
  $("out").setAttribute("fill", answers && p.harm ? "#fbe9e7" : "#e6f4ea");
  S.out = answers ? "outAnswered" : "outRefused"; $("out-text").textContent = t(S.out);
  await sleep(200);
  Object.assign(reply, { typing: false, harm: p.harm, answers, reply: p.reply });
  if (p.harm && S.attack && s.asr != null) { S.prevAsr = S.shownAsr; S.shownAsr = s.asr; }
  S.last = { harm: p.harm, setup: s, cutHitsDecoy, cutHitsRefusal, decoyFires };
  if (p.harm) STEPS.forEach((st, i) => { if (st.test()) S.done.add(i); });
  S.busy = false;
  renderAll();
}

async function change(patch, { resend = true } = {}) {
  if (S.busy) return;
  const before = { ...S };
  Object.assign(S, patch);
  if (S.defense !== before.defense) note("noteDefense", { v: S.defense });
  if (removing() !== (before.remove && before.defense !== "none")) {
    if (removing()) { S.busy = true; resetFlow(); renderAll(); await scan(); S.busy = false; note("noteRemoveOn", { f: (setup().found || "0/9").split("/")[0] }); }
    else note("noteRemoveOff");
  }
  if (S.attack !== before.attack) note(S.attack ? "noteAttackOn" : "noteAttackOff");
  S.last = null; resetFlow(); renderAll();
  if (resend && S.lastPrompt) { await sleep(300); await send(S.lastPrompt); }
}

function caption() {
  const l = S.last;
  if (!l) return t("capIdle");
  if (!l.harm) return t("capSafe");
  if (l.cutHitsDecoy) return removing() && S.defense === "hidden" ? t("capHiddenSurvives") : t("capDecoy");
  if (l.cutHitsRefusal) return removing() ? t("capRemoved") : t("capCut");
  if (l.decoyFires) return t("capDecoyNoAttack");
  return t("capRefuse");
}
function renderTools() {
  const seg = $("seg-defense"); seg.innerHTML = "";
  for (const v of ["none", "ddo", "hidden"]) {
    const b = document.createElement("button"); b.dataset.v = v; b.textContent = defLabel(v);
    b.setAttribute("aria-pressed", S.defense === v); b.disabled = S.busy;
    b.onclick = () => { if (S.defense !== v) change({ defense: v }); };
    seg.appendChild(b);
  }
  $("why-defense").textContent = t({ none: "whyNone", ddo: "whyDdo", hidden: "whyHidden" }[S.defense]);
  const noDef = S.defense === "none";
  $("t-remove").classList.toggle("disabled", noDef);
  $("sw-remove").disabled = noDef || S.busy;
  $("sw-remove").setAttribute("aria-checked", removing());
  $("st-remove").textContent = removing() ? t("on") : t("off");
  $("why-remove").textContent = noDef ? t("whyRemoveNone") : t("whyRemove");
  const s = setup();
  $("found").innerHTML = removing() && s.found
    ? `<span class="badge ${s.found.startsWith("9") ? "bad" : "good"}">${t("found", { f: s.found.split("/")[0] })}</span>` : "";
  $("sw-attack").setAttribute("aria-checked", S.attack); $("sw-attack").disabled = S.busy;
  $("st-attack").textContent = S.attack ? t("on") : t("off");
  $("why-attack").textContent = t("whyAttack");
}
function renderChat() {
  $("chat-status").innerHTML = [t("stDefense", { v: defLabel(S.defense) }), removing() ? t("stRemoved") : null,
    t("stAttack", { v: S.attack ? t("on") : t("off") })].filter(Boolean).join(" · ");
  const box = $("transcript");
  if (!S.chat.length) { box.innerHTML = `<div class="welcome">${t("welcome")}</div>`; }
  else box.innerHTML = S.chat.map(m => {
    if (m.who === "note") return `<div class="sysnote">${t(m.key, { ...m.vars, v: m.vars.v ? defLabel(m.vars.v) : "" })}</div>`;
    if (m.who === "user") return `<div class="bubble user">${t(m.key)}</div>`;
    if (m.typing) return `<div class="bubble bot typing"><span></span><span></span><span></span></div>`;
    if (!m.harm) return `<div class="bubble bot">${t(m.reply)}<span class="meta">${t("metaIllustr")}</span></div>`;
    if (!m.answers) return `<div class="bubble bot refuse">${t("botRefuse")}<span class="meta">${t("metaIllustr")}</span></div>`;
    return `<div class="bubble bot comply">${t("botComply")}<br><span class="redact" style="width:6em"></span><span class="redact" style="width:3em"></span><span class="redact" style="width:5em"></span><span class="meta">${t("redacted")} · ${t("metaIllustr")}</span></div>`;
  }).join("");
  box.scrollTop = box.scrollHeight;
  const chips = $("chips"); chips.innerHTML = "";
  PROMPTS.forEach((p, i) => {
    const b = document.createElement("button");
    b.className = "chip " + (p.harm ? "harm" : "safe") + (!S.chat.length && i === 0 ? " hint" : "");
    b.disabled = S.busy;
    b.innerHTML = `<span class="dot"></span>${t(p.id)}`;
    b.onclick = () => pick(p);
    chips.appendChild(b);
  });
  renderComposer();
}
function renderComposer() {
  const inp = $("input");
  inp.classList.toggle("filled", !!S.input);
  inp.innerHTML = S.input ? `${S.input}<span class="caret"></span>` : t("inputEmpty");
  $("send").disabled = S.busy || !S.lastPrompt;
}
function renderResult() {
  const el = $("result"), l = S.last;
  const waffle = (n, color) => `<div class="waffle">${Array.from({ length: 100 }, (_, i) => `<i style="${i < n ? `background:${color}` : ""}"></i>`).join("")}</div>`;
  const head = `<h2>${t("hResult")}</h2>`;
  if (!l) { el.innerHTML = `${head}<div class="sub">${t("resNone")}</div>${waffle(0)}<div class="note">${t("resNote")}</div>`; return; }
  if (!l.harm) {
    const refused = L.benign[MODEL[S.defense]]?.none, n = refused == null ? null : 100 - refused;
    el.innerHTML = `${head}<div class="sub">${t("resSafe")}</div><div class="row"><div class="big" style="color:${C.ok}">${n ?? "–"}<span style="font-size:.45em">/100</span></div></div>
      ${waffle(n ?? 0, C.ok)}<div class="wlegend"><span><i style="background:${C.ok}"></i>${t("legNormal")}</span></div><div class="note">${t("resNote")}</div>`;
    return;
  }
  if (!S.attack) {
    el.innerHTML = `${head}<div class="row"><div class="big" style="color:${C.ok}">✓</div></div><div class="sub" style="margin-top:6px">${t("resNoAttack")}</div><div class="note">${t("resNote")}</div>`;
    return;
  }
  const asr = l.setup.asr, color = S.defense === "hidden" ? C.blue : C.red;
  const was = S.prevAsr != null && S.prevAsr !== asr ? `<div class="was">${t("resWas", { v: S.prevAsr })} → </div>` : "";
  el.innerHTML = `${head}<div class="sub">${t("resHarm")}</div>
    <div class="row">${was}<div class="big" style="color:${color}">${asr}<span style="font-size:.45em">/100</span></div></div>
    ${waffle(asr, color)}
    <div class="wlegend"><span><i style="background:${color}"></i>${t("legAnswered")}</span><span><i style="background:#e3e6ea"></i>${t("legRefused")}</span></div>
    <div class="note">${t("resNote")}</div>`;
}

const STEPS = [
  { set: { defense: "none", remove: false, attack: false }, test: () => S.defense === "none" && !S.attack },
  { set: { defense: "none", remove: false, attack: true }, test: () => S.defense === "none" && S.attack },
  { set: { defense: "ddo", remove: false, attack: true }, test: () => S.defense === "ddo" && !S.remove && S.attack },
  { set: { defense: "ddo", remove: true, attack: true }, test: () => S.defense === "ddo" && S.remove && S.attack },
  { set: { defense: "hidden", remove: true, attack: true }, test: () => S.defense === "hidden" && S.remove && S.attack },
];
function renderSteps() {
  const box = $("steps"); box.innerHTML = "";
  const next = STEPS.findIndex((_, i) => !S.done.has(i));
  T[lang].steps.forEach((label, i) => {
    const b = document.createElement("button");
    b.className = "step" + (S.done.has(i) ? " done" : i === next ? " next" : "");
    b.title = t("stepTip"); b.disabled = S.busy;
    b.innerHTML = `<span class="n">${S.done.has(i) ? "✓" : i + 1}</span><span class="txt">${label}</span>`;
    b.onclick = async () => {
      if (S.busy) return;
      await change(STEPS[i].set, { resend: false });
      await pick(PROMPTS[0]);
    };
    box.appendChild(b);
  });
}
function renderAll() {
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  renderTools(); renderChat(); renderResult(); renderSteps(); drawStatic();
  $("viz-cap").innerHTML = caption();
  $("out-text").textContent = t(S.out);
}

$("sw-remove").onclick = () => { if (S.defense !== "none") change({ remove: !S.remove }); };
$("sw-attack").onclick = () => change({ attack: !S.attack });
$("send").onclick = () => send(S.lastPrompt);
$("input").onclick = () => { if (!S.busy) { const c = $("chips").firstElementChild; c?.classList.add("hint"); setTimeout(() => c?.classList.remove("hint"), 3200); } };
$("reset").onclick = () => { if (!S.busy) { Object.assign(S, fresh()); resetFlow(); renderAll(); } };
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  lang = b.dataset.lang; document.documentElement.lang = lang;
  document.querySelectorAll(".lang button").forEach(x => x.setAttribute("aria-pressed", x.dataset.lang === lang));
  renderAll();
});
let idle;
const bump = () => { clearTimeout(idle); idle = setTimeout(() => { if (!S.busy) { Object.assign(S, fresh()); resetFlow(); renderAll(); } }, 120_000); };
["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, bump));

resetFlow(); renderAll(); bump();
</script>
</body>
</html>
